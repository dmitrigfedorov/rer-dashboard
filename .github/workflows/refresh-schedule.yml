name: Refresh RER dashboard
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: rer-dashboard-refresh
  cancel-in-progress: false
jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Update schedule from IDFM
        env:
          IDFM_API_TOKEN: ${{ secrets.IDFM_API_TOKEN }}
        run: python3 update_schedule.py
      - name: Publish changed schedule
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schedule.json
          if git diff --cached --quiet; then
            echo 'Schedule content is unchanged.'
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          schedule_file="$(mktemp)"
          cp schedule.json "$schedule_file"
          for attempt in 1 2 3; do
            git commit -m 'Update RER schedule'
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push attempt $attempt failed; rebasing refreshed schedule on the latest main."
            git fetch origin main
            git reset --hard origin/main
            cp "$schedule_file" schedule.json
            git add schedule.json
            if git diff --cached --quiet; then
              echo 'The latest main already contains the refreshed schedule.'
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo 'Unable to publish schedule after three attempts.'
          exit 1
