name: Update RER schedule
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rer-schedule-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Update schedule from IDFM
        env:
          IDFM_API_TOKEN: ${{ secrets.IDFM_API_TOKEN }}
        run: python3 update_schedule.py
      - name: Publish changed schedule
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schedule.json
          if git diff --cached --quiet; then echo 'Schedule content is unchanged.'; exit 0; fi
          git commit -m 'Update RER schedule'
          git push
      - name: Send current schedule to Telegram
        if: vars.TELEGRAM_AUTOMATION_ENABLED == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 send_telegram_report.py
      - name: Save Telegram message state
        if: vars.TELEGRAM_AUTOMATION_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-message-state
          path: telegram_message_id.txt
          retention-days: 30
          overwrite: true
