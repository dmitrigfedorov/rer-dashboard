<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261102-blue-train">
<meta http-equiv="refresh" content="300">
<title>RER C — ближайшие поезда</title>
<style>
:root{color-scheme:dark;--paper:#0d1116;--card:#171d24;--line:#303a43;--ink:#f4f2ec;--muted:#a7b0b8;--blue:#69b9f5;--gold:#f3c96c;--green:#a5dbb0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:4.2vh 4.5vw}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:1.5vw;border-bottom:1px solid var(--line);padding-bottom:2.1vh;margin-bottom:3vh}
.eyebrow{font-size:1.4vw;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}
.title{font-size:4vw;font-weight:700;letter-spacing:-.035em;line-height:1.15;white-space:nowrap;margin:.5vh 0 0}
.title-badge{display:inline-flex;vertical-align:middle;line-height:1;margin:0 .12em}
.top-right{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:1.2vw;row-gap:.25vh;align-items:center}
.language{grid-column:1;grid-row:2}
.weather{grid-column:1;grid-row:1;text-align:right}
.clock{display:contents}
.clock strong{grid-column:2;grid-row:1;align-self:end}
.clock #updated{grid-column:2;grid-row:2;align-self:start;display:flex;align-items:center;justify-content:flex-end;gap:.35em}
.refresh-icon{width:1em;height:1em;flex:none;vertical-align:-.15em}
.language{display:flex;align-items:center;gap:.5vw;color:var(--muted);font-size:1vw;white-space:nowrap}
.lang-menu{position:relative}
.language-trigger{display:flex;align-items:center;gap:.55em;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:.55vw;padding:.65em .75em;font:inherit;cursor:pointer}
.language-trigger:focus,.language-option:focus{outline:3px solid var(--blue);outline-offset:3px}
.flag{display:inline-flex;align-items:center;justify-content:center;width:1.45em;height:1em;flex:none;vertical-align:middle}.flag-icon{display:block;width:100%;height:100%;border:1px solid #ffffff80;box-shadow:0 0 0 1px #0005}
.chevron{width:.48em;height:.48em;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-.25em .15em 0 .35em}
.language-options{position:absolute;z-index:20;top:calc(100% + .35em);right:0;min-width:100%;padding:.2em 0;background:var(--card);border:1px solid #69737d;box-shadow:0 4px 14px #0008}
.language-options[hidden]{display:none}
.language-option{width:100%;display:flex;align-items:center;gap:.6em;padding:.52em .75em;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;white-space:nowrap;cursor:pointer}
.language-option:hover,.language-option[aria-selected="true"]{background:#263541}
.clock{text-align:right;font-size:1vw;color:var(--muted);white-space:nowrap}
.clock strong{display:block;color:var(--ink);font-size:2.7vw;font-weight:600;margin-bottom:.5vh}
.clock #updated{display:block;font-size:1vw;margin-top:.3vh}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr)) auto;grid-template-areas:"rer-ivry bus-quai" "rer-bfm bus-vincennes" ". bus-eglise";gap:2vw}
.grid.legacy-grid{grid-template-areas:none}
.grid.legacy-grid .panel{grid-area:auto}
.panel[data-card="rer-ivry"]{grid-area:rer-ivry}
.panel[data-card="bus-quai"]{grid-area:bus-quai}
.panel[data-card="rer-bfm"]{grid-area:rer-bfm}
.panel[data-card="bus-vincennes"]{grid-area:bus-vincennes}
.panel[data-card="bus-eglise"]{grid-area:bus-eglise}
.panel{background:var(--card);border:1px solid var(--line);border-radius:1.1vw;padding:1.6vw 2.3vw;min-height:0}
.route-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5vw}
.route{font-size:1.55vw;color:var(--muted);line-height:1.35;min-height:4.4vw}
.route b{color:var(--ink);font-weight:600}
.station-line{display:flex;align-items:center;justify-content:center;width:5.5vw;height:5.5vw;min-width:42px;min-height:42px;border-radius:1.2vw;background:#f4cc00;color:#171d24;font-size:3.8vw;line-height:1;font-weight:700;flex:none}
.station-line.bus-line{width:8.2vw;height:5.5vw;min-width:58px;min-height:40px;border-radius:1.2vw;background:#8bd3df;color:#101619;font-size:3.8vw;letter-spacing:-.04em}
h1.title .station-line{display:inline-flex;vertical-align:middle}
.direction{display:flex;align-items:center;gap:.7vw;color:var(--gold);font-size:1.05vw;letter-spacing:.12em;text-transform:uppercase;margin:2vh 0 1.3vh}
.train{border-top:1px solid var(--line);min-height:calc(3 * 1.3em + 2.1vh);padding:1.6vh 0;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr) minmax(4.3em,.55fr);align-items:center;gap:1.2vw}
.bus-panel .train{min-height:calc(6.6vw + 4vh)}
.departure{min-width:0}
.departure-label{font-size:1.25vw;line-height:1.3;color:var(--muted);min-height:1.3em}
.countdown{display:flex;align-items:baseline;gap:.72vw;margin-top:.25em;white-space:nowrap}
.countdown-icon{width:1.8vw;height:1.8vw;min-width:16px;min-height:16px;color:#68c9a7;flex:none;align-self:center}
.signal-arc{animation:signal-arc 2.4s ease-in-out infinite}
.signal-inner{animation:signal-inner 2.4s ease-in-out infinite}
@keyframes signal-arc{0%,14%,100%{opacity:1}30%,72%{opacity:0}88%{opacity:1}}
@keyframes signal-inner{0%,31%,100%{opacity:1}48%,57%{opacity:0}72%{opacity:1}}
@media(prefers-reduced-motion:reduce){.signal-arc,.signal-inner{animation:none}}
.countdown strong{font-size:2.2vw;line-height:1;color:var(--ink)}
.countdown-green strong{color:#68c9a7}
.countdown-yellow strong{color:#f3c96c}
.countdown-red strong{color:#ff6b6b}
.countdown-text.past-departure{color:#ff6b6b}
.countdown small{font-size:1.1vw;line-height:inherit;color:var(--muted)}
.countdown-text{font-size:1.45vw;line-height:1.3;color:var(--ink);margin-top:.3em}
.train-details{min-width:0;text-align:left}
.train-name{font-size:1.45vw;line-height:1.4;color:var(--muted)}
.train-name b{color:var(--ink);font-weight:700}
.times{font-size:2.2vw;font-weight:700;white-space:nowrap;margin-top:.25em}
.times small{font-size:1.1vw;color:var(--muted);font-weight:400}
.meta{font-size:1.25vw;line-height:1.6;color:var(--muted)}
.meta b{color:var(--ink);font-size:1.45vw}
.platform{text-align:right}
.badge{display:inline-block;border:1px solid #527d5a;color:var(--green);border-radius:999px;padding:.4em .75em;font-size:.92vw;white-space:nowrap}
.empty{padding:5vh 0;color:var(--muted);font-size:1.4vw}
.bottom{display:flex;justify-content:space-between;gap:2vw;margin-top:2.3vh;color:var(--muted);font-size:1vw}
@media(max-aspect-ratio:4/3){
 body{padding:3vh 4vw}
 .top{align-items:flex-start;gap:2vw}
 .top-right{display:flex;align-items:flex-end;flex-direction:column;gap:1vh}
 .clock{display:block}
 .clock strong,.clock #updated{grid-column:auto;grid-row:auto}
 .language{font-size:1.5vw}
 .language-trigger,.language-option{font-size:1.5vw}
 .grid{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"rer-ivry" "rer-bfm" "bus-quai" "bus-vincennes" "bus-eglise"}
 .grid.legacy-grid{grid-template-areas:none}
 .panel[data-card="rer-ivry"],.panel[data-card="rer-bfm"],.panel[data-card="bus-quai"],.panel[data-card="bus-vincennes"],.panel[data-card="bus-eglise"]{grid-area:auto}
 .title{font-size:6vw}
 .eyebrow{font-size:2vw}
 .clock strong{font-size:3.4vw}
 .clock{font-size:1.8vw}
 .clock #updated{font-size:1.4vw}
 .panel{padding:3vw;min-height:auto}
 .route{font-size:2.3vw;min-height:auto}
 .station-line{width:8vw;height:8vw;border-radius:1.8vw;font-size:5vw}
 .station-line.bus-line{width:12vw;height:8vw;min-width:48px;min-height:40px;border-radius:1.8vw;font-size:5vw}
 .countdown-icon{width:3vw;height:3vw}
 .direction{font-size:1.7vw}
 .departure-label{font-size:2.1vw}
 .countdown{gap:1.1vw}
 .countdown-icon{width:3vw;height:3vw}
 .countdown strong{font-size:3.4vw}
 .countdown small{font-size:1.8vw}
 .countdown-text{font-size:2vw}
 .train{grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr) auto;gap:2vw}
 .train-name{font-size:2vw}
 .times{font-size:3.4vw}
 .times small{font-size:1.7vw}
 .meta{font-size:1.8vw}
 .meta b{font-size:2vw}
 .badge{font-size:1.4vw}
 .bottom{font-size:1.4vw}
}
@media(max-width:640px){
 body{padding:16px}
 .top{align-items:flex-start;gap:12px;padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
 .eyebrow{font-size:11px}
 .title{font-size:clamp(22px,6vw,32px)}
 .top-right{gap:10px;align-items:flex-start}
 .clock{display:block}
 .clock strong,.clock #updated{grid-column:auto;grid-row:auto}
 .clock #updated{justify-content:flex-start}
 .language{font-size:12px}
 .language-trigger,.language-option{font-size:12px}
 .clock{font-size:11px}
 .clock strong{font-size:26px}
 .clock #updated{font-size:10px}
 .grid{gap:12px}
 .panel{padding:18px;min-height:auto;border-radius:14px}
 .route{font-size:16px;min-height:0}
 .station-line{width:48px;height:48px;min-width:48px;min-height:48px;border-radius:12px;font-size:32px}
 .station-line.bus-line{width:62px;height:46px;min-width:62px;min-height:46px;border-radius:11px;font-size:32px}
 .countdown-icon{width:18px;height:18px}
 .direction{font-size:11px;margin:14px 0 10px}
 .train{grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr) auto;gap:8px;padding:15px 0}
 .departure-label{font-size:12px}
 .countdown{gap:6px}
 .countdown-icon{width:18px;height:18px}
 .countdown strong{font-size:24px}
 .countdown small{font-size:13px}
 .countdown-text{font-size:14px}
 .train-name{font-size:13px;line-height:1.35}
 .times{font-size:22px}
 .times small{font-size:13px}
 .meta{font-size:11px}
 .meta b{font-size:13px}
 .badge{font-size:10px}
 .bottom{font-size:10px;margin-top:16px}
}
.weather{text-align:right;color:var(--muted);white-space:nowrap}
.weather-main{display:block;font-size:1.5vw;color:var(--ink)}
.weather-main-row{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.weather-health{width:8px;height:8px;border-radius:50%;flex:none;background:#e2b85c;box-shadow:0 0 0 1px #0d1116}
.weather-health.fresh{background:#68c9a7}
.weather-health.stale{background:#ff6b6b}
.precipitation-forecast{display:block;font-size:20px;line-height:1.2;margin-top:3px;color:var(--muted)}
@media(max-aspect-ratio:4/3){.weather{text-align:left}.weather-main-row{justify-content:flex-start}.weather-main{font-size:2.2vw}undefined}
@media(max-width:640px){.weather{white-space:normal}.weather-main-row{justify-content:flex-start}.weather-main{font-size:16px}undefined}
</style>
</head>
<body>
<header class="top">
  <div>
    <div class="eyebrow"><span id="eyebrow-text">Transilien • ближайшие отправления</span></div>
    <h1 class="title" id="page-title">Ближайшие поезда RER C</h1>
  </div>
  <div class="top-right">
    <div class="language">
      <label id="language-label">Язык</label>
      <div class="lang-menu">
        <button id="language-toggle" class="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="language-label language-current">
          <span id="language-current-flag" class="flag flag-ru" aria-hidden="true"></span>
          <span id="language-current">Русский</span><span class="chevron" aria-hidden="true"></span>
        </button>
        <div id="language-options" class="language-options" role="listbox" aria-labelledby="language-label" hidden>
          <button class="language-option" type="button" role="option" data-language="ru" aria-selected="true"><span class="flag"><svg class="flag-icon" viewBox="0 0 30 20" aria-hidden="true"><path fill="#fff" d="M0 0h30v20H0z"/><path fill="#0039a6" d="M0 6.67h30v13.33H0z"/><path fill="#d52b1e" d="M0 13.33h30V20H0z"/></svg></span>Русский</button>
          <button class="language-option" type="button" role="option" data-language="fr" aria-selected="false"><span class="flag"><svg class="flag-icon" viewBox="0 0 30 20" aria-hidden="true"><path fill="#0055a4" d="M0 0h10v20H0z"/><path fill="#fff" d="M10 0h10v20H10z"/><path fill="#ef4135" d="M20 0h10v20H20z"/></svg></span>Français</button>
          <button class="language-option" type="button" role="option" data-language="bg" aria-selected="false"><span class="flag"><svg class="flag-icon" viewBox="0 0 30 20" aria-hidden="true"><path fill="#fff" d="M0 0h30v6.67H0z"/><path fill="#00966e" d="M0 6.67h30v6.66H0z"/><path fill="#d62612" d="M0 13.33h30V20H0z"/></svg></span>Български</button>
        </div>
      </div>
    </div>
    <div class="weather" aria-live="polite" aria-atomic="true">
      <span class="weather-main-row"><span id="weather-health" class="weather-health" role="img" aria-label="Погода загружается"></span><span id="weather-current" class="weather-main">Погода…</span></span>
      <span id="precipitation-forecast" class="precipitation-forecast" aria-live="polite">Прогноз осадков…</span>
    </div>
    <div class="clock">
      <strong id="clock">--:--</strong>
      <span id="updated" aria-label="Время обновления">загрузка…</span>
    </div>
  </div>
</header>
<main class="grid" id="schedule"></main>
<footer class="bottom">
  <span id="refresh-note">Обновление каждые 5 минут</span>
  <span id="data-note">Данные Île-de-France Mobilités • Ivry-sur-Seine</span>
</footer>
<script>
const fallback={fetchedAtParis:"",directions:[]};
const storageKey="rer-dashboard-language";

const weatherDataKey="rer-dashboard-weather-data";
let weatherSnapshot=null;
let weatherStatus="pending";
async function fetchWithTimeout(url,options,timeoutMs=12000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{return await fetch(url,{...options,signal:controller.signal})}
 finally{clearTimeout(timer)}
}
const weatherConditions={
 0:["☀️","Ясно","Dégagé","Ясно"],1:["🌤️","Преимущественно ясно","Peu nuageux","Предимно ясно"],2:["⛅","Переменная облачность","Partiellement nuageux","Променлива облачност"],3:["☁️","Пасмурно","Couvert","Облачно"],
 45:["🌫️","Туман","Brouillard","Мъгла"],48:["🌫️","Изморозь и туман","Brouillard givrant","Скреж и мъгла"],
 51:["🌦️","Лёгкая морось","Bruine légère","Слаб ръмеж"],53:["🌦️","Морось","Bruine","Ръмеж"],55:["🌧️","Сильная морось","Bruine dense","Силен ръмеж"],56:["🌧️","Ледяная морось","Bruine verglaçante","Леден дъжд"],57:["🌧️","Сильная ледяная морось","Bruine verglaçante dense","Силен леден ръмеж"],
 61:["🌧️","Небольшой дождь","Pluie faible","Слаб дъжд"],63:["🌧️","Дождь","Pluie modérée","Дъжд"],65:["🌧️","Сильный дождь","Forte pluie","Силен дъжд"],66:["🌧️","Ледяной дождь","Pluie verglaçante","Леден дъжд"],67:["🌧️","Сильный ледяной дождь","Forte pluie verglaçante","Силен леден дъжд"],
 71:["🌨️","Небольшой снег","Faibles chutes de neige","Слаб сняг"],73:["🌨️","Снег","Chutes de neige modérées","Сняг"],75:["❄️","Сильный снег","Fortes chutes de neige","Силен сняг"],77:["🌨️","Снежные зёрна","Grains de neige","Снежни зърна"],
 80:["🌦️","Кратковременный дождь","Averses faibles","Слаби превалявания"],81:["🌧️","Ливень","Averses modérées","Превалявания"],82:["🌧️","Сильный ливень","Fortes averses","Силни превалявания"],85:["🌨️","Снегопад","Averses de neige faibles","Слаб снеговалеж"],86:["❄️","Сильный снегопад","Fortes averses de neige","Силен снеговалеж"],
 95:["⛈️","Гроза","Orage","Гръмотевична буря"],96:["⛈️","Гроза с градом","Orage et grêle","Гръмотевична буря с град"],99:["⛈️","Сильная гроза с градом","Orage violent et grêle","Силна гръмотевична буря с град"]
};
async function weatherLocation(){
 const response=await fetchWithTimeout("https://ipwho.is/",{cache:"no-store"});
 if(!response.ok)throw new Error("IP geolocation unavailable");
 const geo=await response.json();
 if(!geo.success||!Number.isFinite(Number(geo.latitude))||!Number.isFinite(Number(geo.longitude)))throw new Error("IP geolocation failed");
 return {latitude:Number(geo.latitude),longitude:Number(geo.longitude),city:String(geo.city||geo.region||geo.country||""),savedAt:Date.now()};
}
function setWeatherHealth(){
 const element=document.getElementById("weather-health"),t=translations[currentLanguage];
 const pending=weatherStatus==="pending",fresh=weatherStatus==="fresh",failed=weatherStatus==="error";
 element.className="weather-health "+(pending?"":fresh?"fresh":"stale");
 const label=pending?t.weatherStatusLoading:fresh?t.weatherStatusFresh:failed?t.weatherStatusError:t.weatherStatusStale;
 element.setAttribute("aria-label",label);
 element.title=label;
}
function readCachedWeather(){
 try{
  const cached=JSON.parse(localStorage.getItem(weatherDataKey)||"null");
  if(cached&&Number.isFinite(cached.temperature)&&Number.isFinite(cached.code)&&Number.isFinite(cached.latitude)&&Number.isFinite(cached.longitude)&&Number.isFinite(cached.savedAt))return cached;
 }catch(_){}
 return null;
}
function renderPrecipitation(){
 const target=document.getElementById("precipitation-forecast"),t=translations[currentLanguage];
 if(!weatherSnapshot){target.textContent=weatherStatus==="pending"?t.precipLoading:t.precipUnavailable;return}
 if(!Array.isArray(weatherSnapshot.precipitationForecast)){target.textContent=t.precipUnavailable;return}
 const periods=weatherSnapshot.precipitationForecast;
 const forecast=periods.length?t.precipPrefix+periods.map(period=>period.time+" "+period.icon).join(" · "):t.precipNone;
 const high=Number.isFinite(weatherSnapshot.maxTemperature)?" · "+t.tempMax+Math.round(weatherSnapshot.maxTemperature)+"°":"";
 target.textContent=forecast+high;
}
function renderWeather(){
 const target=document.getElementById("weather-current"),t=translations[currentLanguage];
 setWeatherHealth();
 if(!weatherSnapshot){target.textContent=weatherStatus==="pending"?t.weatherLoading:t.weatherUnavailable;renderPrecipitation();return}
 const condition=weatherConditions[weatherSnapshot.code]||["🌡️","Переменная погода","Conditions variables","Променливо време"];
 const label=condition[currentLanguage==="ru"?1:currentLanguage==="fr"?2:3];
 target.textContent=condition[0]+" "+Math.round(weatherSnapshot.temperature)+"°C"+(weatherSnapshot.city?" · "+weatherSnapshot.city:"")+" · "+label;
 renderPrecipitation();
}
async function loadWeather(){
 const target=document.getElementById("weather-current");
 const cached=readCachedWeather();
 if(cached){
  weatherSnapshot=cached;
  weatherStatus="pending";
  renderWeather();
 }else{
  weatherSnapshot=null;
  weatherStatus="pending";
  renderWeather();
 }
 try{
  const location=await weatherLocation();
  const params=new URLSearchParams({latitude:String(location.latitude),longitude:String(location.longitude),current:"temperature_2m,weather_code,is_day",hourly:"precipitation_probability,precipitation,weather_code",daily:"temperature_2m_max",forecast_days:"1",temperature_unit:"celsius",timezone:"auto"});
  const response=await fetchWithTimeout("https://api.open-meteo.com/v1/forecast?"+params.toString(),{cache:"no-store"});
  if(!response.ok)throw new Error("Weather service unavailable");
  const data=await response.json(),current=data.current;
  if(data.error||!current||!Number.isFinite(Number(current.temperature_2m)))throw new Error(data.reason||"Weather data unavailable");
  const hourly=data.hourly||{},times=hourly.time||[],probabilities=hourly.precipitation_probability||[],amounts=hourly.precipitation||[],codes=hourly.weather_code||[];
  const precipitationForecast=[];
  let previousWet=false,previousHour=null;
  for(let i=0;i<times.length;i++){
   const time=times[i];
   if(time.slice(0,10)!==String(current.time||"").slice(0,10)||time<=current.time)continue;
   const probability=Number(probabilities[i]||0),amount=Number(amounts[i]||0),wet=probability>=40||amount>=0.1;
   const parts=time.match(/^(\d{4})-(\d{2})-(\d{2})T(\d{2}):/);
   const hour=parts?Date.UTC(Number(parts[1]),Number(parts[2])-1,Number(parts[3]),Number(parts[4])):null;
   if(wet&&(!previousWet||hour===null||previousHour===null||hour-previousHour!==3600000)){
    const code=Number(codes[i]),condition=weatherConditions[code]||["🌧️"];
    precipitationForecast.push({time:time.slice(11,16),icon:condition[0]});
   }
   previousWet=wet;
   previousHour=hour;
  }
  const maxTemperature=Number(data.daily&&data.daily.temperature_2m_max&&data.daily.temperature_2m_max[0]);
  weatherSnapshot={latitude:location.latitude,longitude:location.longitude,temperature:Number(current.temperature_2m),code:Number(current.weather_code),city:location.city,precipitationForecast,maxTemperature,savedAt:Date.now()};
  weatherStatus="fresh";
  try{localStorage.setItem(weatherDataKey,JSON.stringify(weatherSnapshot))}catch(_){}
  renderWeather();
 }catch(_){
  weatherStatus="stale";
  if(!weatherSnapshot){
   weatherStatus="error";
   target.textContent=translations[currentLanguage].weatherUnavailable;
   renderPrecipitation();
   setWeatherHealth();
   return;
  }
  renderWeather();
 }
}

const repairText=s=>{s=String(s==null?"—":s);if(/[ÃÂ]/.test(s)){try{return new TextDecoder().decode(Uint8Array.from([...s].map(c=>c.charCodeAt(0))))}catch(_){}}return s};
const esc=s=>repairText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentData=fallback;
let currentLanguage="ru";
function getSavedLanguage(){try{const value=localStorage.getItem(storageKey);return translations[value]?value:"ru"}catch(_){return "ru"}}
function departureTimestamp(time){
 const p=time.split(":").map(Number),d=new Date();
 d.setHours(p[0],p[1],0,0);
 const now=new Date();
 if(d<now&&now-d>12*60*60*1000)d.setDate(d.getDate()+1);
 return d;
}
function minutesUntil(time){return Math.round((departureTimestamp(time)-Date.now())/60000)}
function countdown(time){
 const t=translations[currentLanguage],delta=departureTimestamp(time).getTime()-Date.now();
 if(delta<0)return t.ago+Math.max(1,Math.floor(-delta/60000))+t.agoEnd;
 if(delta<60000)return t.now;
 return t.inMinutes+Math.max(1,Math.round(delta/60000))+t.minutes;
}
function departureMarkup(time){
 const t=translations[currentLanguage],n=minutesUntil(time);
 const colorClass=n>=8?"green":n>=6?"yellow":"red";
 if(n>0)return '<div class="departure-label">'+esc(t.departure+t.inMinutes)+'</div><div class="countdown countdown-'+colorClass+'"><svg class="countdown-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="signal-arc" d="M8.3 4.4C3.6 8.2 3.6 15.8 8.3 19.6" fill="none" stroke="currentColor" stroke-width="4.8" stroke-linecap="round"/><path class="signal-inner" d="M14.6 7.6C11.7 9.8 11.7 14.2 14.6 16.4" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/></svg><strong>'+n+'</strong><small>'+esc(t.minutes.trim())+'</small></div>';
 const departed=departureTimestamp(time).getTime()<Date.now();
 return '<div class="departure-label">'+esc(t.departure.trim())+'</div><div class="countdown-text'+(departed?' past-departure':'')+'">'+esc(countdown(time))+'</div>';
}
function statusText(value){const key=String(value==null?"":value);return translations[currentLanguage].statuses[key]||key||"—"}
function setUpdated(value,label){
 const element=document.getElementById("updated");
 element.setAttribute("aria-label",label+(value?" "+value:""));
 element.title=label+(value?" "+value:"");
 element.innerHTML='<svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5M5.64 9A7 7 0 0 1 17.5 6.5L20 12M4 12l2.5 5.5A7 7 0 0 0 18.36 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>'+esc(value||"")+'</span>';
}
function paint(data){
 const t=translations[currentLanguage],grid=document.getElementById("schedule");
 const dashboardCards=Array.isArray(data.cards),panels=dashboardCards?data.cards:(data.directions||[]);
 grid.classList.toggle("legacy-grid",!dashboardCards);
 grid.innerHTML=panels.map(d=>{
  const bus=d.mode==="bus",line=d.line||(bus?"325":"C"),badgeClass=bus?"station-line bus-line":"station-line";
  const modeLabel=bus?"BUS "+line:"RER C",cardClass=bus?"panel bus-panel":"panel";
  return '<section class="'+cardClass+'" data-card="'+esc(d.card||"")+'"><div class="route-header"><div class="route"><b>'+esc(d.title)+'</b><br>'+t.to+esc(d.destination)+'</div><span class="'+badgeClass+'" aria-label="'+modeLabel+'">'+esc(line)+'</span></div>'+
  '<div class="direction">'+(bus?t.nearestBus:t.nearest)+'</div>'+
  ((d.rows||[]).map(r=>{
   const trainName=bus?'<div class="train-name"><b>'+esc(r.train||line)+'</b> · '+esc(r.destinationName||d.destination)+'</div>':'<div class="train-name"><b>'+esc(r.train)+'</b> · '+esc(r.destinationName)+'</div>';
   const times=bus?esc(r.from):esc(r.from)+' <small>→ '+esc(r.to)+'</small>';
   const details=bus?'<div class="meta platform"><span class="badge">'+esc(statusText(r.status))+'</span></div>':'<div class="meta platform">'+t.platform+'<br><b>'+esc(r.platform)+'</b><br><span class="badge">'+esc(statusText(r.status))+'</span></div>';
   return '<div class="train"><div class="departure">'+departureMarkup(r.from)+'</div><div class="train-details">'+trainName+'<div class="times">'+times+'</div></div>'+details+'</div>';
  }).join('')||'<div class="empty">'+t.empty+'</div>')+'</section>';
 }).join('');
 setUpdated(data.fetchedAtParis,t.updatedLabel);
}
function flagMarkup(language){return {"ru":"<svg class=\"flag-icon\" viewBox=\"0 0 30 20\" aria-hidden=\"true\"><path fill=\"#fff\" d=\"M0 0h30v20H0z\"/><path fill=\"#0039a6\" d=\"M0 6.67h30v13.33H0z\"/><path fill=\"#d52b1e\" d=\"M0 13.33h30V20H0z\"/></svg>","fr":"<svg class=\"flag-icon\" viewBox=\"0 0 30 20\" aria-hidden=\"true\"><path fill=\"#0055a4\" d=\"M0 0h10v20H0z\"/><path fill=\"#fff\" d=\"M10 0h10v20H10z\"/><path fill=\"#ef4135\" d=\"M20 0h10v20H20z\"/></svg>","bg":"<svg class=\"flag-icon\" viewBox=\"0 0 30 20\" aria-hidden=\"true\"><path fill=\"#fff\" d=\"M0 0h30v6.67H0z\"/><path fill=\"#00966e\" d=\"M0 6.67h30v6.66H0z\"/><path fill=\"#d62612\" d=\"M0 13.33h30V20H0z\"/></svg>"}[language]||{"ru":"<svg class=\"flag-icon\" viewBox=\"0 0 30 20\" aria-hidden=\"true\"><path fill=\"#fff\" d=\"M0 0h30v20H0z\"/><path fill=\"#0039a6\" d=\"M0 6.67h30v13.33H0z\"/><path fill=\"#d52b1e\" d=\"M0 13.33h30V20H0z\"/></svg>","fr":"<svg class=\"flag-icon\" viewBox=\"0 0 30 20\" aria-hidden=\"true\"><path fill=\"#0055a4\" d=\"M0 0h10v20H0z\"/><path fill=\"#fff\" d=\"M10 0h10v20H10z\"/><path fill=\"#ef4135\" d=\"M20 0h10v20H20z\"/></svg>","bg":"<svg class=\"flag-icon\" viewBox=\"0 0 30 20\" aria-hidden=\"true\"><path fill=\"#fff\" d=\"M0 0h30v6.67H0z\"/><path fill=\"#00966e\" d=\"M0 6.67h30v6.66H0z\"/><path fill=\"#d62612\" d=\"M0 13.33h30V20H0z\"/></svg>"}.ru}
function applyLanguage(language,persist){
 currentLanguage=translations[language]?language:"ru";
 const t=translations[currentLanguage];
 document.documentElement.lang=currentLanguage;
 document.title=t.title+" — Transilien";
 document.getElementById("language-current").textContent={ru:"Русский",fr:"Français",bg:"Български"}[currentLanguage];
 document.getElementById("language-current-flag").className="flag";document.getElementById("language-current-flag").innerHTML=flagMarkup(currentLanguage);
 document.querySelectorAll(".language-option").forEach(option=>option.setAttribute("aria-selected",String(option.dataset.language===currentLanguage)));
 document.getElementById("language-label").textContent=t.language;

 renderWeather();
 document.getElementById("eyebrow-text").textContent=t.eyebrow;
 document.getElementById("page-title").innerHTML=t.heading;
 document.getElementById("refresh-note").textContent=t.refresh;
 document.getElementById("data-note").textContent=t.data;
 if(!currentData.fetchedAtParis)setUpdated(t.loading,t.updatedLabel);
 if(persist){try{localStorage.setItem(storageKey,currentLanguage)}catch(_){}}
 tick();
 paint(currentData);
}
function tick(){document.getElementById("clock").textContent=new Intl.DateTimeFormat(translations[currentLanguage].locale,{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"Europe/Paris"}).format(new Date())}
async function loadSchedule(){try{const response=await fetch("schedule.json?ts="+Date.now(),{cache:"no-store"});currentData=response.ok?await response.json():fallback}catch(_){currentData=fallback}paint(currentData)}
const languageToggle=document.getElementById("language-toggle");
const languageOptions=document.getElementById("language-options");
let languageMenuHistoryEntry=false;
function closeLanguageMenu(restoreFocus,fromHistory){
 const wasOpen=!languageOptions.hidden;
 languageOptions.hidden=true;languageToggle.setAttribute("aria-expanded","false");
 if(wasOpen&&languageMenuHistoryEntry){
  languageMenuHistoryEntry=false;
  if(!fromHistory){try{history.back()}catch(_){}}
 }
 if(restoreFocus)languageToggle.focus();
}
function openLanguageMenu(){
 languageOptions.hidden=false;languageToggle.setAttribute("aria-expanded","true");
 try{history.pushState({rerLanguageMenu:true},"",location.href);languageMenuHistoryEntry=true}catch(_){}
 const selected=languageOptions.querySelector("[aria-selected=\"true\"]");if(selected)selected.focus();
}
window.addEventListener("popstate",()=>{
 if(languageMenuHistoryEntry){languageMenuHistoryEntry=false;if(!languageOptions.hidden)closeLanguageMenu(true,true)}
});
languageToggle.addEventListener("click",()=>{if(languageOptions.hidden)openLanguageMenu();else closeLanguageMenu(false)});
languageOptions.addEventListener("click",event=>{
 const option=event.target.closest("[data-language]");
 if(!option)return;
 applyLanguage(option.dataset.language,true);
 closeLanguageMenu();
 languageToggle.focus();
});
document.addEventListener("click",event=>{if(!event.target.closest(".lang-menu"))closeLanguageMenu()});
function remoteKey(event){
 const code=event.keyCode||event.which||0;
 const byCode={13:"Enter",32:" ",37:"ArrowLeft",38:"ArrowUp",39:"ArrowRight",40:"ArrowDown",27:"Escape",8:"Back",461:"Back",10009:"Back"};
 if(byCode[code])return byCode[code];
 const key=String(event.key||"");
 if(key==="Back"||key==="BrowserBack"||key==="GoBack"||key==="XF86Back"||key==="Backspace")return "Back";
 // Tizen reports Back as keyCode 0 while a custom list option owns focus.
 if(code===0&&languageOptions&&!languageOptions.hidden)return "Back";
 if(key==="Escape")return "Escape";
 return key;
}
languageToggle.addEventListener("keydown",event=>{const key=remoteKey(event);if(key==="Enter"||key===" "){event.preventDefault();openLanguageMenu()}});
languageOptions.addEventListener("keydown",event=>{const key=remoteKey(event),options=Array.from(languageOptions.querySelectorAll(".language-option")),index=options.indexOf(document.activeElement);if(key==="ArrowDown"||key==="ArrowUp"){event.preventDefault();options[(index+(key==="ArrowDown"?1:options.length-1))%options.length].focus()}else if(key==="Enter"||key===" "){event.preventDefault();document.activeElement.click()}else if(key==="Escape"||key==="Backspace"){event.preventDefault();closeLanguageMenu(true)}});
function handleRemoteBack(event){
 const key=remoteKey(event);
 if((key==="Back"||key==="Escape")&&!languageOptions.hidden){
  event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
  closeLanguageMenu(true);
 }
}
window.addEventListener("keydown",handleRemoteBack,true);
window.addEventListener("keyup",handleRemoteBack,true);
document.addEventListener("keydown",event=>{
 const key=remoteKey(event);
 if(!languageOptions.hidden)return;
 if(key==="ArrowDown"||key==="ArrowUp"){
  const height=Math.max(220,Math.round(window.innerHeight*.78));
  event.preventDefault();
  window.scrollBy(0,key==="ArrowDown"?height:-height);
 }
},true);
applyLanguage(getSavedLanguage(),false);
window.addEventListener("load",()=>{try{languageToggle.focus()}catch(_){}});
loadSchedule();
loadWeather();
setInterval(tick,1000);
setInterval(loadSchedule,30000);
setInterval(loadWeather,10*60*1000);
