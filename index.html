<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="300">
  <title>RER C — ближайшие поезда</title>
  <style>
    :root{color-scheme:dark;--paper:#0d1116;--card:#171d24;--line:#303a43;--ink:#f4f2ec;--muted:#a7b0b8;--blue:#69b9f5;--gold:#f3c96c;--green:#a5dbb0}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    body{padding:4.2vh 4.5vw}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:2.1vh;margin-bottom:3vh}
    .eyebrow{font-size:1.4vw;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}.title{font-size:4vw;font-weight:700;letter-spacing:-.035em;margin:.5vh 0 0}.clock{text-align:right;font-size:1.35vw;color:var(--muted)}.clock strong{display:block;color:var(--ink);font-size:2.25vw;font-weight:600;margin-bottom:.5vh}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:2vw}.panel{background:var(--card);border:1px solid var(--line);border-radius:1.1vw;padding:2.1vw 2.3vw;min-height:45vh}.route{font-size:1.55vw;color:var(--muted);line-height:1.35;min-height:4.4vw}.route b{color:var(--ink);font-weight:600}.direction{display:flex;align-items:center;gap:.7vw;color:var(--gold);font-size:1.05vw;letter-spacing:.12em;text-transform:uppercase;margin:2vh 0 1.3vh}
    .train{border-top:1px solid var(--line);padding:2.1vh 0;display:grid;grid-template-columns:1.05fr 1fr .72fr;align-items:center;gap:1vw}.times{font-size:2.2vw;font-weight:700;white-space:nowrap}.times small{font-size:1.1vw;color:var(--muted);font-weight:400}.meta{font-size:1.25vw;line-height:1.6;color:var(--muted)}.meta b{color:var(--ink);font-size:1.45vw}.platform{text-align:right}.badge{display:inline-block;border:1px solid #527d5a;color:var(--green);border-radius:999px;padding:.4em .75em;font-size:.92vw;white-space:nowrap}.empty{padding:5vh 0;color:var(--muted);font-size:1.4vw}
    .bottom{display:flex;justify-content:space-between;gap:2vw;margin-top:2.3vh;color:var(--muted);font-size:1vw}.line{display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;height:2.1em;border-radius:50%;background:#e9d851;color:#222;font-size:.8em;font-weight:700;margin-right:.6vw}
    @media(max-aspect-ratio:4/3){body{padding:3vh 4vw}.grid{grid-template-columns:1fr}.title{font-size:6vw}.eyebrow{font-size:2vw}.clock strong{font-size:3vw}.clock{font-size:1.8vw}.panel{padding:3vw;min-height:auto}.route{font-size:2.3vw;min-height:auto}.direction{font-size:1.7vw}.times{font-size:3.4vw}.times small{font-size:1.7vw}.meta{font-size:1.8vw}.meta b{font-size:2vw}.badge{font-size:1.4vw}.bottom{font-size:1.4vw}}
  </style>
</head>
<body>
  <header class="top">
    <div><div class="eyebrow"><span class="line">C</span> Transilien • ближайшие отправления</div><h1 class="title">Ближайшие поезда RER</h1></div>
    <div class="clock"><strong id="clock">--:--</strong><span>Париж</span></div>
  </header>
  <main class="grid" id="schedule"></main>
  <footer class="bottom"><span id="updated">Загрузка расписания…</span><span>Данные Île-de-France Mobilités • Ivry-sur-Seine</span></footer>
  <script>
    const fallback = {
      fetchedAtParis: "29.10.2026, 14:59:48",
      directions: [
        {title:"Ivry-sur-Seine", destination:"Bibliothèque François-Mitterrand", rows:[{from:"15:13",to:"15:16",train:"NORA",destinationName:"Pontoise",platform:"2B",status:"onTime"}]},
        {title:"Bibliothèque François-Mitterrand", destination:"Ivry-sur-Seine", rows:[{from:"15:00",to:"15:03",train:"ROMI",destinationName:"Pont de Rungis Aéroport d’Orly",platform:"E",status:"onTime"}]}
      ]
    };
    const esc = s => String(s ?? "—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    function countdown(hhmm){const [h,m]=hhmm.split(":").map(Number);const now=new Date();const d=new Date(now);d.setHours(h,m,0,0);const mins=Math.round((d-now)/60000);return mins < -1?`ушёл ${Math.abs(mins)} мин назад`:mins<=0?"сейчас":`через ${mins} мин`}
    function paint(data){
      document.getElementById('schedule').innerHTML=(data.directions||[]).map(d=>`<section class="panel"><div class="route"><b>${esc(d.title)}</b><br>до ${esc(d.destination)}</div><div class="direction">Ближайший поезд</div>${(d.rows||[]).map(r=>`<div class="train"><div class="times">${esc(r.from)} <small>→ ${esc(r.to)}</small></div><div class="meta"><b>${esc(r.train)}</b> · ${esc(r.destinationName)}<br>Отправление ${esc(countdown(r.from))}</div><div class="meta platform">Путь<br><b>${esc(r.platform)}</b><br><span class="badge">${esc(r.status)}</span></div></div>`).join('')||'<div class="empty">Ближайшие отправления не найдены</div>'}</section>`).join('');
      document.getElementById('updated').textContent=`Обновлено: ${data.fetchedAtParis} (Париж)`;
    }
    function tick(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('ru-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Europe/Paris'}).format(new Date())}
    async function loadSchedule(){try{const res=await fetch('schedule.json?ts='+Date.now(),{cache:'no-store'});if(res.ok)paint(await res.json());else paint(fallback)}catch(_){paint(fallback)}}
    loadSchedule();tick();setInterval(tick,1000);setInterval(loadSchedule,30000);
  </script>
</body>
</html>
